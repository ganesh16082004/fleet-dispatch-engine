server:
  port: 8080

spring:
  application:
    name: fleet-dispatch-engine
  mongodb:
    uri: ${MONGODB_URI}
  data:
    redis:
      url: ${REDIS_URL}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fleet-dispatch-engine
      auto-offset-reset: earliest

fleet:
  redis:
    driver-location-ttl: ${DRIVER_LOCATION_TTL:10m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
